[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seren-agent"
version = "0.1.0"
description = "SDK for building monetizable AI agents on the Seren Store"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Seren", email = "support@seren.ai" }
]
keywords = ["ai", "agents", "llm", "monetization", "x402"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No required dependencies - LLM packages are optional
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-generativeai>=0.3.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://seren.ai"
Documentation = "https://docs.seren.ai/agents"
Repository = "https://github.com/serenai/seren-agents"
Issues = "https://github.com/serenai/seren-agents/issues"

[tool.hatch.build.targets.wheel]
packages = ["seren_agent"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
